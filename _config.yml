# ===================================================================
# Site Settings — Chirpy theme (cotes2020/jekyll-theme-chirpy 7.x)
# ===================================================================

lang: en
timezone: Europe/London

# Site metadata
title: "Opinions of a Shadow Engineer!"
tagline: "Software. Enablement. The invisible work that matters."
description: >-
  The latest attempt to return to tech blogging — sharing thoughts on software
  development, DevOps, AI-assisted engineering, and the communities that hold
  it all together. https://github.com/abuxton · https://blog.abcdevelopment.co.uk

url: "https://blog.abcdevelopment.co.uk"
baseurl: ""

# Social / profile
github:
  username: abuxton

social:
  name: Adam Buxton
  email: ""
  links:
    - https://github.com/abuxton
    - https://www.linkedin.com/in/adambuxton

linkedin: adambuxton

# Site avatar (place image in /assets/img/ and reference here)
avatar: ""

# Table of contents on posts by default
toc: true

# Comments — set active: "" to disable, or "disqus" / "utterances" / "giscus"
comments:
  active: ""

# Progressive Web App
pwa:
  enabled: false

# Posts per page on the home feed
paginate: 10

# Build settings
theme: jekyll-theme-chirpy

plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-seo-tag

# jekyll-archives powers the /categories/ and /tags/ pages
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# Default front matter applied to all posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - common/
  - Makefile
  - AGENTS.md
  - skills-lock.json
  - "*.sh"

