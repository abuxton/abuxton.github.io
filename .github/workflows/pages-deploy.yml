name: "Build and Deploy to GitHub Pages"

# Chirpy is not on the GitHub Pages safe-list, so we build with Bundler
# (which supports Chirpy) and push the compiled static site to the gh-pages
# branch. A .nojekyll file is included so GitHub's native builder skips
# Jekyll processing and serves the pre-built files directly.
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - AGENTS.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fetch existing gh-pages branch (if any) to preserve history
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          # Set up a worktree for the gh-pages branch
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git worktree add ../gh-pages-deploy gh-pages
          else
            git worktree add --orphan -b gh-pages ../gh-pages-deploy
          fi
          # Sync built site into the worktree, keeping only .git
          rsync -a --delete --exclude='.git' _site/ ../gh-pages-deploy/
          cd ../gh-pages-deploy
          git add -A
          git diff-index --quiet HEAD -- || git commit -m "chore: deploy ${GITHUB_SHA:0:7}"
          git push origin gh-pages
